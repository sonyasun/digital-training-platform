<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 广联达数字实训平台</title>
  <link rel="stylesheet" href="css/fonts.css?v=20260914b" />
  <link rel="stylesheet" href="css/tokens.css?v=20260914b" />
  <link rel="stylesheet" href="css/login.css?v=20260914b" />
</head>
<body class="login-page">
  <main class="login">
    <div class="login-card">
      <div class="login-card__visual">
        <img class="login-card__deco" src="assets/login/deco-layer.webp" alt="" decoding="async" />
        <div class="login-card__brand">
          <img class="login-card__logo" src="assets/login/logo-mark.svg" width="160" height="45" alt="" />
          <p class="login-card__subtitle">数字实训平台</p>
        </div>
        <img class="login-card__hero" src="assets/login/hero.webp" alt="" decoding="async" />
      </div>

      <div class="login-card__form-wrap">
        <form class="login-form" data-login-form action="prepare.html" method="get">
          <div class="login-tabs" role="tablist" aria-label="登录方式">
            <button type="button" class="login-tabs__item is-active" role="tab" aria-selected="true" data-login-tab="account">账号登录</button>
            <button type="button" class="login-tabs__item" role="tab" aria-selected="false" data-login-tab="sms">验证码登录</button>
            <button type="button" class="login-tabs__item" role="tab" aria-selected="false" data-login-tab="scan">扫码登录</button>
          </div>

          <div class="login-panel" data-login-panel="account">
            <div class="login-fields">
              <label class="login-field login-field--focus">
                <span class="login-field__label visually-hidden">账号</span>
                <input class="login-field__input" type="text" name="account" autocomplete="username" placeholder="请输入账号" />
              </label>
              <label class="login-field">
                <span class="login-field__label visually-hidden">密码</span>
                <input class="login-field__input" type="password" name="password" autocomplete="current-password" placeholder="请输入密码" />
              </label>
              <div class="login-captcha">
                <label class="login-field login-field--captcha">
                  <span class="login-field__label visually-hidden">验证码</span>
                  <input class="login-field__input" type="text" name="captcha" autocomplete="off" placeholder="请输入验证码" />
                </label>
                <div class="login-captcha__box" aria-hidden="true"></div>
              </div>
            </div>

            <div class="login-options">
              <label class="login-remember">
                <input class="login-remember__input" type="checkbox" name="remember" />
                <span class="login-remember__box" aria-hidden="true"></span>
                <span class="login-remember__label">记住密码</span>
              </label>
              <button type="button" class="login-forgot">忘记密码</button>
            </div>

            <div class="login-roles" data-login-roles>
              <span class="login-roles__label">临时角色</span>
              <div class="login-roles__group" role="group" aria-label="临时角色">
                <button type="button" class="login-roles__btn is-active" data-login-role="teacher" aria-pressed="true">老师角色</button>
                <button type="button" class="login-roles__btn" data-login-role="student" aria-pressed="false">学生角色</button>
              </div>
            </div>

            <button type="submit" class="login-submit">登录</button>
          </div>

          <div class="login-panel login-panel--empty" data-login-panel="sms" hidden></div>
          <div class="login-panel login-panel--empty" data-login-panel="scan" hidden></div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/role.js?v=20260828c" defer></script>
  <script src="js/login.js?v=20260828c" defer></script>
</body>
</html>
