      <span class="nodestudy-crumb__current" data-nodestudy-crumb-current aria-current="page">节点学习</span>

    <div class="nodestudy__layout">
      <section class="nodestudy-panel" aria-label="学习资源">
        <header class="nodestudy-panel__head">
          <div class="nodestudy-panel__title-wrap">
            <h1 class="nodestudy-panel__title" data-nodestudy-title>—</h1>
          </div>
          <div class="nodestudy-panel__meta">
            <span class="nodestudy-panel__tag" data-nodestudy-type>—</span>
            <span class="nodestudy-panel__tag" data-nodestudy-mastery>掌握率 —</span>
            <span class="nodestudy-panel__tag" data-nodestudy-duration>—</span>
          </div>
        </header>

        <div class="nodestudy-categories" role="tablist" aria-label="学习模块分类">
          <button type="button" class="nodestudy-categories__btn is-active" role="tab" aria-selected="true" data-nodestudy-category="study">学习</button>
          <button type="button" class="nodestudy-categories__btn" role="tab" aria-selected="false" data-nodestudy-category="discuss">研讨</button>
          <button type="button" class="nodestudy-categories__btn" role="tab" aria-selected="false" data-nodestudy-category="test">测试</button>
        </div>

        <div class="nodestudy-panel__body">
          <div class="nodestudy-viewer" data-nodestudy-viewer aria-live="polite">
            <div class="nodestudy-viewer__placeholder" data-nodestudy-viewer-placeholder>
              <span class="nodestudy-viewer__icon" data-nodestudy-viewer-icon aria-hidden="true"></span>
              <p class="nodestudy-viewer__hint" data-nodestudy-viewer-hint>切换上方模块开始学习</p>
            </div>
          </div>
        </div>
      </section>

      <aside
        class="nodestudy-agent saistudy-agent"
        data-saistudy-agent
        data-nodestudy-agent
        data-saistudy-agent-title="AI个性化助手"
        data-saistudy-agent-placeholder="针对当前资源提问……"
        aria-label="AI个性化助手"
      >
        <div class="saistudy-agent__body">
          <div class="saistudy-agent__chat" data-nodestudy-agent-chat data-saistudy-agent-chat>

              <strong>正在识别你的学习行为</strong>
              <p>切换学习、研讨或测试模块时，我会实时同步分析并给出建议。</p>
            </header>
            <section class="saistudy-insight" data-nodestudy-insight data-saistudy-agent-insight aria-label="学习识别结论"></section>
          </div>
        </div>
      </aside>
