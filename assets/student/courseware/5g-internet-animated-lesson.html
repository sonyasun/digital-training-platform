hecks{counter-reset:q;display:grid;gap:13px;margin-top:24px}.check{counter-increment:q;display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:center;padding:12px 0 18px;border-bottom:1px solid var(--line);font:17px/1.7 "PingFang SC",sans-serif}.check:before{content:counter(q);width:42px;height:42px;border:1px solid var(--blue);border-radius:50%;display:grid;place-items:center;color:var(--blue);font:700 16px sans-serif}.subtitle{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;max-width:88%;padding:9px 18px;border-radius:8px;background:rgba(3,7,14,.88);font:15px/1.65 "PingFang SC",sans-serif;text-align:center;opacity:0}.subtitle.on{opacity:1}.controls{display:flex;align-items:center;gap:9px;padding:10px 16px;flex-wrap:wrap;flex-shrink:0}.controls button,.controls select,.toc button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 13px;cursor:pointer;font:13px "PingFang SC",sans-serif}.controls button:hover,.controls button:focus-visible,.controls select:focus-visible,.toc button:focus-visible{border-color:var(--blue);outline:none}.controls .primary{background:var(--blue);border-color:var(--blue);color:#081123;font-weight:700}.progress{height:6px;background:#26334e;border-radius:8px;overflow:hidden;flex:1;min-width:160px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--mint));transition:width .25s}.page{min-width:48px;text-align:center;color:var(--muted);font:12px sans-serif}.toc{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:0 16px 12px;margin:0;flex-shrink:0}.toc button{padding:7px 10px;color:var(--muted);border-color:transparent}.toc button.current{border-color:var(--blue);color:var(--ink)}.rv{opacity:0;transform:translateY(12px);transition:.55s ease}.current .rv{opacity:1;transform:none}@keyframes pulse{0%{transform:scale(.65);opacity:0}45%{opacity:.9}100%{transform:scale(1.08);opacity:0}}@media(max-width:760px){.crumb{display:none <script>const BRIEF={"unit_id": "u044", "canonical_name": "虚拟施工", "original_name": "虚拟施工", "lineage": ["智能建造及BIM技术", "业务地图补充材料", "虚拟施工"], "coverage": "absent", "summary": "虚拟施工是在实际建造前，以BIM模型和施工数据模拟工序、资源、空间与构件关系，提前发现问题并优化方案。", "diagram_mode": "pipeline", "points": [{"label": "施工模拟", "explanation": "验证工序、进度、资源和空间组织"}, {"label": "构件虚拟拼装", "explanation": "检查碰撞、连接、精度和安装顺序"}, {"label": "临时设施规划", "explanation": "优化机械、道路、堆场和人员流线"}, {"label": "方案反馈", "explanation": "把模拟发现的问题返回计划、设计和现场准备"}], "mechanism": ["识别并采集与施工模拟相关的对象和数据", "依据构件虚拟拼装完成分析、组织或处理", "通过临时设施规划连接参与方与业务环节", "用方案反馈形成结果并反馈校验"], "engineering_scene": "复杂吊装前先在模型中验证机械站位、构件路径、作业半径与相邻工序，确认方案后再组织现场实施。", "checks": ["虚拟施工为什么不是单纯三维展示？", "模拟需要哪些时间和资源数据？", "虚拟结果如何进入现场执行？"], "evidence": [{"source": "KMD 转换文本：[4.6]基于BIM的虚拟建造.md L3-L36；数字建造导论-丁列云-全本.md L1784-L1857；数字建造概论 杜修力-全本.md L1918-L2124；[3.3.1]智能工地内涵和特征.md L3-L30", "support": "该节点原业务资源缺失，由KMD转换后的教材或课件证据补充生成。"}], "uncertainties": ["材料为AI生成初稿，需任课教师确认后正式发布"], "review_status": "teacher_review_required"},DATA=[{"toc": "开篇", "kind": "cover", "narration": "本讲学习虚拟施工。虚拟施工是在实际建造前，以BIM模型和施工数据模拟工序、资源、空间与构件关系，提前发现问题并优化方案。"}, {"toc": "结构", "kind": "structure", "title": "虚拟施工的知识结构", "intro": "先看清各要素承担的作用以及它们之间的关系。", "points": [{"label": "施工模拟", "explanation": "验证工序、进度、资源和空间组织"}, {"label": "构件虚拟拼装", "explanation": "检查碰撞、连接、精度和安装顺序"}, {"label": "临时设施规划", "explanation": "优化机械、道路、堆场和人员流线"}, {"label": "方案反馈", "explanation": "把模拟发现的问题返回计划、设计和现场准备"}], "narration": "这一知识点可以拆成四个相互关联的部分。施工模拟，验证工序、进度、资源和空间组织。构件虚拟拼装，检查碰撞、连接、精度和安装顺序。临时设施规划，优化机械、道路、堆场和人员流线。方案反馈，把模拟发现的问题返回计划、设计和现场准备"}, {"toc": "机制", "kind": "mechanism", "title": "从输入到结果", "intro": "知识进入过程后才会产生业务价值。", "points": [{"label": "输入", "explanation": "识别并采集与施工模拟相关的对象和数据"}, {"label": "处理", "explanation": "依据构件虚拟拼装完成分析、组织或处理"}, {"label": "协同", "explanation": "通过临时设施规划连接参与方与业务环节"}, {"label": "结果", "explanation": "用方案反馈形成结果并反馈校验"}], "narration": "它的运行机制依次是。识别并采集与施工模拟相关的对象和数据。依据构件虚拟拼装完成分析、组织或处理。通过临时设施规划连接参与方与业务环节。用方案反馈形成结果并反馈校验"}, {"toc": "场景", "kind": "scene", "title": "工程场景中的具体用法", "narration": "下面把概念放进工程场景。复杂吊装前先在模型中验证机械站位、构件路径、作业半径与相邻工序，确认方案后再组织现场实施。"}, {"toc": "小结", "kind": "summary", "title": "四个记忆锚点", "narration": "本讲可以归纳为四个记忆锚点。施工模拟，验证工序、进度、资源和空间组织。构件虚拟拼装，检查碰撞、连接、精度和安装顺序。临时设施规划，优化机械、道路、堆场和人员流线。方案反馈，把模拟发现的问题返回计划、设计和现场准备"}, {"toc": "检查", "kind": "check", "title": "确认你真正理解了", "narration": "最后，请思考三个问题。虚拟施工为什么不是单纯三维展示？。模拟需要哪些时间和资源数据？。虚拟结果如何进入现场执行？"}],MODE=BRIEF.diagram_mode;let current=0,playing=false,subtitleOn=true,queue=[],queueIndex=0;const host=document.getElementById('host'),toc=document.getElementById('toc'),sub=document.getElementById('subtitle'),bar=document.getElementById('bar'),page=document.getElementById('page'),play=document.getElementById('play');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function visual(points){return `<div class="visual ${MODE}">${points.map((p,i)=>`<article class="item rv" style="--i:${i}" data-no="0${i+1}"><b>${esc(p.label)}</b><p>${esc(p.explanation)}</p></article>`).join('')}</div>`}function slideHtml(s){if(s.kind==='cover')return `<div class="cover"><div><div class="eyebrow">ANIMATED KNOWLEDGE BRIEF · ${esc(BRIEF.unit_id)}</div><h2>${esc(BRIEF.canonical_name)}</h2><p class="lead">${esc(BRIEF.summary)}</p><div class="chips">${BRIEF.points.map(x=>`<span class="chip rv">${esc(x.label)}</span>`).join('')}</div></div><div class="mark"><b>${esc(BRIEF.canonical_name.slice(0,4))}</b></div></div>`;if(s.kind==='structure'||s.kind==='mechanism')return `<div class="eyebrow">${s.kind==='structure'?'KNOWLEDGE STRUCTURE':'HOW IT WORKS'}</div><h2>${esc(s.title)}</h2><p class="lead">${esc(s.intro)}</p>${visual(s.points)}`;if(s.kind==='scene')return `<div class="eyebrow">ENGINEERING SCENE</div><h2>${esc(s.title)}</h2><div class="scene"><div class="scene-label rv"><span>把概念放进真实任务</span><b>${esc(BRIEF.canonical_name)}</b></div><div class="scene-text rv">${esc(BRIEF.engineering_scene)}</div></div>${visual(BRIEF.mechanism.map((x,i)=>({label:['输入','处理','协同','结果'][i],explanation:x})))}`;if(s.kind==='summary')return `<div class="eyebrow">MEMORY ANCHORS</div><h2>${esc(s.title)}</h2><div class="anchors">${BRIEF.points.map((p,i)=>`<div class="anchor rv"><i>0${i+1}</i><div><b>${esc(p.label)}</b><span>${esc(p.explanation)}</span></div></div>`).join('')}</div>`;return `<div class="eyebrow">LEARNING CHECK</div><h2>${esc(s.title)}</h2><div class="checks">${BRIEF.checks.map(q=>`<div class="check rv">${esc(q)}</div>`).join('')}</div>`}DATA.forEach((s,i)=>{const b=document.createElement('button');b.textContent=`${i+1}. ${s.toc}`;b.onclick=()=>load(i,false);toc.appendChild(b)});function load(i,keep=false){speechSynthesis.cancel();current=(i+DATA.length)%DATA.length;host.innerHTML=slideHtml(DATA[current]);[...toc.children].forEach((x,k)=>x.classList.toggle('current',k===current));page.textContent=`${current+1} / ${DATA.length}`;bar.style.width=`${current/DATA.length*100}%`;sub.textContent='';sub.classList.remove('on');if(keep)startNarration()}function sentences(t){return String(t).replace(/([。！？；])/g,'$1|').split('|').map(x=>x.trim()).filter(Boolean)}function startNarration(){if(!('speechSynthesis'in window)){sub.textContent='当前浏览器不支持本地朗读，请使用页面图文学习。';sub.classList.add('on');return}queue=sentences(DATA[current].narration);queueIndex=0;playing=true;play.textContent='⏸ 暂停讲解';speakNext()}function speakNext(){if(!playing)return;if(queueIndex>=queue.length){if(current<DATA.length-1)load(current+1,true);else{stopNarration();bar.style.width='100%'}return}const text=queue[queueIndex++],u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=+document.getElementById('rate').value;u.onstart=()=>{sub.textContent=text;sub.classList.toggle('on',subtitleOn);bar.style.width=`${((current+queueIndex/Math.max(queue.length,1))/DATA.length)*100}%`};u.onend=speakNext;u.onerror=()=>{sub.textContent='朗读不可用，完整图文仍可正常使用。';sub.classList.add('on');stopNarration()};speechSynthesis.speak(u)}function stopNarration(){playing=false;speechSynthesis.cancel();play.textContent='▶ 播放讲解';sub.classList.remove('on')}function togglePlay(){playing?stopNarration():startNarration()}function nav(d){const keep=playing;load(current+d,keep)}function toggleSubtitle(){subtitleOn=!subtitleOn;document.getElementById('subtoggle').textContent=`字幕 ${subtitleOn?'开':'关'}`;sub.classList.toggle('on',subtitleOn&&playing)}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1);if(e.key===' '&&!/BUTTON|SELECT/.test(e.target.tagName)){e.preventDefault();togglePlay()}});window.addEventListener('beforeunload',()=>speechSynthesis.cancel());load(0,false);</script></body></html>
